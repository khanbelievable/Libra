bundle:
  name: libra-milestone-1

include:
  - databricks/resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for Libra Delta tables
  schema:
    description: Unity Catalog schema for Milestone 1
    default: libra
  landing_path:
    description: Workspace or Volume path containing one generated batch directory

artifacts:
  default:
    type: whl
    path: .
    build: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

