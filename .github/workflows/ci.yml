name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,spark]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy src/datalibra

      - name: Test with coverage
        run: python -m pytest -q --cov=datalibra --cov-report=term --cov-branch --cov-fail-under=90

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install wheel artifact
        run: python -m pip install --force-reinstall --find-links dist datalibra==0.2.0

      - name: Smoke-test installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: libra generate healthy --output libra-wheel-smoke
